name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Setup Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:WIX/bin/candle.exe")) {
            throw 'WiX 3 is required to build the Windows installer'
          }
          "$env:WIX/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Assemble installers
        shell: bash
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          installer_version="${GITHUB_REF_NAME#v}"
          ./gradlew jreleaserAssemble -PisRelease=true -PinstallerVersion="$installer_version"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/jreleaser/assemble/scoreboard/jpackage/*.dmg
            build/jreleaser/assemble/scoreboard/jpackage/*.deb
            build/jreleaser/assemble/scoreboard/jpackage/*.rpm
            build/jreleaser/assemble/scoreboard/jpackage/*.exe

  release:
    needs: installers
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: build/native-release
      - name: Verify installer formats
        shell: bash
        run: |
          for extension in dmg deb rpm exe; do
            if ! compgen -G "build/native-release/*.$extension" > /dev/null; then
              echo "Missing $extension installer"
              exit 1
            fi
          done
      - name: Release with JReleaser
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jreleaserRelease -PisRelease=true -PnativeRelease=true
